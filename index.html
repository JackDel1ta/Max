<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Заблокировано</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #f2f2f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #1c1c1e;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 36px 24px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .shield {
    width: 76px;
    height: 76px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #ffe5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 12px;
    line-height: 1.3;
  }
  p {
    font-size: 15px;
    color: #6e6e73;
    line-height: 1.45;
    margin: 0 0 8px;
  }
  .code {
    font-size: 13px;
    color: #aeaeb2;
    margin-top: 20px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .btn {
    margin-top: 24px;
    width: 100%;
    padding: 13px;
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>Веб-страница заблокирована антивирусным ПО</h1>
    <p>Данная страница была помечена как потенциально опасная
       и заблокирована для защиты вашего устройства.</p>
    <p>Если вы уверены, что это ошибка, обратитесь
       в службу поддержки вашего антивируса.</p>
    <div class="code">Error code: BLOCKED_BY_AV_0x0004</div>
    <button class="btn" onclick="history.back()">Вернуться назад</button>
  </div>
</body>
</html>
